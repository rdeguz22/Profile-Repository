<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
  }

  .event-date {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .timer {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .segment {
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 12px;
    padding: 16px 12px;
    min-width: 80px;
    flex: 1;
  }

  .segment .value {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .segment .label {
    margin-top: 4px;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .done {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--accent);
  }

  .install-btn {
    margin-top: 24px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .install-btn:hover {
    filter: brightness(1.05);
  }

  .event-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .event-header h1 {
    margin: 0;
  }

  .edit-btn {
    background: transparent;
    border: 1px solid rgba(148, 163, 184, 0.35);
    color: var(--muted);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    flex: none;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
  }

  .edit-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .secondary-btn {
    background: transparent;
    border: 1px solid rgba(148, 163, 184, 0.35);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .secondary-btn:hover {
    border-color: var(--accent);
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .overlay[hidden] {
    display: none;
  }

  .dialog {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  .dialog h2 {
    margin: 0 0 20px;
    font-size: 1.2rem;
  }

  .field {
    text-align: left;
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: rgba(148, 163, 184, 0.08);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
  }

  .primary-btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .text-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .text-btn:hover {
    color: var(--text);
  }

  @media (max-width: 420px) {
    .segment { min-width: 60px; padding: 12px 8px; }
    .segment .value { font-size: 1.6rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="event-header">
      <h1 id="eventName">HYROX Boston</h1>
      <button id="editBtn" class="edit-btn" type="button" title="Edit event" aria-label="Edit event">&#9998;</button>
    </div>
    <p class="event-date" id="eventDate"></p>
    <div class="timer" id="timer">
      <div class="segment">
        <div class="value" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="segment">
        <div class="value" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="segment">
        <div class="value" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="segment">
        <div class="value" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>
    <div class="actions">
      <button id="installBtn" class="install-btn" hidden>Install App</button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog">
      <h2>Set your event</h2>
      <form id="eventForm">
        <div class="field">
          <label for="nameInput">Event name</label>
          <input type="text" id="nameInput" required maxlength="60" placeholder="e.g. HYROX Boston">
        </div>
        <div class="field">
          <label for="dateInput">Target date &amp; time</label>
          <input type="datetime-local" id="dateInput" required>
        </div>
        <div class="dialog-actions">
          <button type="button" id="cancelBtn" class="text-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "countdownEvent";
    const DEFAULT_EVENT = { name: "HYROX Boston", date: "2026-11-08T08:00:00" };

    function loadEvent() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.name && saved.date && !isNaN(new Date(saved.date))) {
          return saved;
        }
      } catch (e) {
        // ignore malformed storage, fall through to default
      }
      return DEFAULT_EVENT;
    }

    function saveEvent(event) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(event));
    }

    let EVENT_NAME;
    let TARGET_DATE;
    let intervalId;
    let daysEl, hoursEl, minutesEl, secondsEl;

    const eventNameEl = document.getElementById("eventName");
    const eventDateEl = document.getElementById("eventDate");
    const timerEl = document.getElementById("timer");
    const timerSegmentsHTML = timerEl.innerHTML;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const now = new Date();
      const diff = TARGET_DATE - now;

      if (diff <= 0) {
        timerEl.innerHTML = `<div class="done">${EVENT_NAME} has arrived!</div>`;
        clearInterval(intervalId);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    function start(event) {
      EVENT_NAME = event.name;
      TARGET_DATE = new Date(event.date);

      eventNameEl.textContent = EVENT_NAME;
      eventDateEl.textContent = TARGET_DATE.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      // restore the segment markup in case a previous countdown finished
      // and replaced it with the "arrived" message
      timerEl.innerHTML = timerSegmentsHTML;
      daysEl = document.getElementById("days");
      hoursEl = document.getElementById("hours");
      minutesEl = document.getElementById("minutes");
      secondsEl = document.getElementById("seconds");

      if (intervalId) clearInterval(intervalId);
      tick();
      intervalId = setInterval(tick, 1000);
    }

    start(loadEvent());

    // Edit dialog
    const overlay = document.getElementById("overlay");
    const editBtn = document.getElementById("editBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const eventForm = document.getElementById("eventForm");
    const nameInput = document.getElementById("nameInput");
    const dateInput = document.getElementById("dateInput");

    function toLocalInputValue(date) {
      const offsetMs = date.getTimezoneOffset() * 60 * 1000;
      return new Date(date.getTime() - offsetMs).toISOString().slice(0, 16);
    }

    function openDialog() {
      nameInput.value = EVENT_NAME;
      dateInput.value = toLocalInputValue(TARGET_DATE);
      overlay.hidden = false;
      nameInput.focus();
    }

    function closeDialog() {
      overlay.hidden = true;
    }

    editBtn.addEventListener("click", openDialog);
    cancelBtn.addEventListener("click", closeDialog);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeDialog();
    });

    eventForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const date = dateInput.value;
      if (!name || !date) return;

      const event = { name, date };
      saveEvent(event);
      closeDialog();
      start(event);
    });

    // PWA install prompt
    const installBtn = document.getElementById("installBtn");
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>

</body>
</html>
